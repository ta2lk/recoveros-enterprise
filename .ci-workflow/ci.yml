# Legacy copy retained for historical reference. GitHub executes .github/workflows/ci.yml.
name: RecoverOS Enterprise CI/CD (legacy reference)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Automated Test Suite
        run: npm test

      - name: Production Build
        run: npm run build
